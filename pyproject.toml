[project]
name = "lodestone-mcp"
version = "0.1.0"
description = "MCP server for project-aware Claude memory with hybrid RAG"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "sqlite-vec>=0.1.6",
    "pysqlite3-binary>=0.5; sys_platform != 'win32'",
    "voyageai>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lodestone-mcp = "lodestone_mcp.server:main"
lodestone-purge = "lodestone_mcp.admin:purge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lodestone_mcp"]

[tool.pytest.ini_options]
# Put evals/ on sys.path during tests so its modules are importable
# without making it a package (keeps `python evals/run.py` working).
pythonpath = ["evals"]
